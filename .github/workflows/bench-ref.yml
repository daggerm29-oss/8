name: bench-ref

on:
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  bench-ref:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: [self-hosted, helix-reference]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full reference-hardware regression gate (never substitute synthetic results)
        run: node bench/run.mjs --all
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-benchmarks
          path: bench/results/
          if-no-files-found: warn
